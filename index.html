<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<script>window.KS_WEB = true;</script>
<title>Kinetic Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: sticky bar with section tabs; list views for invoices, reports, receipts and clients;
   editors pair a form column with a paginated letter-size document, same paper system as SOW Studio. */
:root{
  --bg:#E8EBF0; --panel:#FFFFFF; --panel-2:#F3F5F8; --ink:#14171C; --ink-2:#4B5361; --ink-3:#7A8392;
  --line:#D2D7DF; --accent:#2347D6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --warn:#9A4A00; --warn-bg:#FFF1D6; --ok:#17713A; --ok-bg:#DDF3E4; --danger:#B42318; --danger-bg:#FDE7E5; --on-danger:#fff;
  --paper:#FFFFFF; --paper-ink:#15171B; --paper-mute:#5D6470; --paper-line:#D5DAE1; --paper-soft:#F2F4F7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --barh:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --panel:#161A21; --panel-2:#1C212A; --ink:#E7EAF0; --ink-2:#A6AFBD; --ink-3:#7C8696;
  --line:#2B323D; --accent:#8299FF; --accent-ink:#0D1015; --accent-soft:#1E2747;
  --warn:#F5B94A; --warn-bg:#33260A; --ok:#5BD08A; --ok-bg:#10301D; --danger:#FF8A80; --danger-bg:#3A1714; --on-danger:#2B0B08; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1015; --panel:#161A21; --panel-2:#1C212A; --ink:#E7EAF0; --ink-2:#A6AFBD; --ink-3:#7C8696;
  --line:#2B323D; --accent:#8299FF; --accent-ink:#0D1015; --accent-soft:#1E2747;
  --warn:#F5B94A; --warn-bg:#33260A; --ok:#5BD08A; --ok-bg:#10301D; --danger:#FF8A80; --danger-bg:#3A1714; --on-danger:#2B0B08; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.brand{margin-right:auto}
.tab{border:0;background:transparent;padding:7px 11px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--panel)}
.tab .ct{font-family:var(--f-mono);font-size:10.5px;opacity:.7;margin-left:4px}
.ctx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-line{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.status-line.dirty{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* "Are you sure?" state: stays red with white text, including on hover and on tabs */
.btn.armed,.btn.armed:hover,.btn.ghost.armed:hover,.tab.armed,.tab.armed:hover,.iconbtn.armed,.iconbtn.armed:hover{background:var(--danger);border-color:var(--danger);color:var(--on-danger);filter:none}
.btn.armed:hover,.tab.armed:hover,.iconbtn.armed:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
.btn.armed:focus-visible,.tab.armed:focus-visible{outline:2px solid var(--danger);outline-offset:2px}

/* ---------- list views ---------- */
.view{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.v-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.v-head h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin-right:auto;text-wrap:balance}
.v-head p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-left:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.tiles>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px 13px;min-width:0}
.tiles i{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tiles b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.tiles small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tiles .bad b{color:var(--danger)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools .grow{flex:1 1 200px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;max-width:100%;flex-wrap:wrap;background:var(--panel)}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.inp,.tools select,.tools input{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:13px;min-width:0}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:150px minmax(0,1.6fr) 90px 110px 120px 170px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:var(--panel);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--panel-2)}
.lrow .msb{padding:2px 8px;font-size:11.5px;margin-left:4px}
.lrow.th{cursor:default;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-block:9px;background:var(--panel-2)}
.lrow .num{font-family:var(--f-mono);font-size:12px;font-weight:600}
.lrow .who{min-width:0}
.lrow .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .who span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.lrow .d.late{color:var(--danger);font-weight:600}
.lrow .amt{font-family:var(--f-mono);font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .lrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .lrow.th{display:none}
  .lrow .num{grid-column:1}.lrow .st{grid-column:2;grid-row:1;justify-self:end}
  .lrow .who{grid-column:1/-1}.lrow .d{grid-column:1}.lrow .amt{grid-column:2}
  .lrow .d.hide-m{display:none}
}
.pill{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap;display:inline-block;border:1px solid transparent}
.pill.draft,.pill.internal{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}
.pill.sent,.pill.submitted,.pill.reported{background:var(--accent-soft);color:var(--accent)}
.pill.paid,.pill.approved,.pill.reimbursed,.pill.invoiced{background:var(--ok-bg);color:var(--ok)}
.pill.overdue{background:var(--danger-bg);color:var(--danger)}
.pill.review,.pill.reading,.pill.unbilled{background:var(--warn-bg);color:var(--warn)}
.pill.void{background:transparent;color:var(--ink-3);border-color:var(--line);text-decoration:line-through}
.pill.example{background:transparent;color:var(--ink-3);border:1px dashed var(--ink-3)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3);font-size:13px;background:var(--panel)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* receipts */
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--panel);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center;margin-bottom:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.drop p{margin:6px 0 10px;color:var(--ink-2);font-size:13px}
.assign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.drop{grid-template-columns:minmax(0,1fr)}.assign{grid-template-columns:minmax(0,1fr)}}
.queue{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.q-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12.5px}
.q-item .mono{margin-left:auto}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bulk{position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px) + 8px);z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.bulk b{font-size:13px;margin-right:auto;padding-left:4px}
.bulk .btn{background:transparent;border-color:rgba(255,255,255,.25);color:inherit}
.bulk .btn:hover{background:rgba(255,255,255,.1)}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative;min-width:0}
.rc:hover{border-color:var(--ink-3)}
.rc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.rc .ck{position:absolute;top:8px;left:8px;z-index:2;width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid #c9ced6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rc .ck input{width:15px;height:15px;margin:0;cursor:pointer}
.rc .th{aspect-ratio:4/3;background:var(--panel-2);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line);max-width:100%}
.rc .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.rc .th span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rc .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rc .t1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rc .t1 strong{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.rc .t2{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .t3{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:4px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-width:0}
.cat i{width:9px;height:9px;border-radius:2px;flex:none}
.sumline{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin:12px 0 0;text-align:right}

/* clients */
.cl-grid{display:flex;flex-direction:column;gap:14px}
.cl{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cl-h{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.cl-h .nm{margin-right:auto;min-width:0}
.cl-h .nm b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.cl-h .nm span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.cl-stats{display:flex;gap:18px;flex-wrap:wrap}
.cl-stats div{min-width:0}
.cl-stats i{display:block;font-style:normal;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cl-stats b{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.pj{display:grid;grid-template-columns:minmax(0,1.5fr) 140px 110px 110px auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.pj:first-child{border-top:0}
.pj .pn b{display:block;font-weight:600}
.pj .pn span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.pj .m{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pj .m i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pj .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:820px){.pj{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pj .pn{grid-column:1/-1}.pj .acts{grid-column:1/-1;justify-content:flex-start}}
.pj-empty{padding:12px 16px;color:var(--ink-3);font-size:13px}

/* ---------- editor ---------- */
.work{display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);gap:0;align-items:start}
.form-col{border-right:1px solid var(--line);background:var(--panel);min-width:0;min-height:calc(100vh - var(--barh));
  padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.prev-col{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh));max-height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px));overflow:auto;
  padding-block:20px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:980px){
  .work{grid-template-columns:minmax(0,1fr)}
  .form-col{border-right:0;border-bottom:1px solid var(--line);min-height:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .prev-col{position:static;max-height:none;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
.prev-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.prev-head h2{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:18px}
.sheet{width:calc(816px * var(--s,1));height:calc(1056px * var(--s,1));position:relative;box-shadow:0 1px 2px rgba(10,14,22,.18),0 8px 28px rgba(10,14,22,.14);border-radius:2px;overflow:hidden;flex:none}
.sheet>.page{transform:scale(var(--s,1));transform-origin:0 0;position:absolute;left:0;top:0}

.banner{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.checks{border-radius:var(--r);padding:10px 12px;margin-bottom:16px;font-size:13px}
.checks.ok{background:var(--ok-bg);color:var(--ok)}
.checks.warn{background:var(--warn-bg);color:var(--warn)}
.checks ul{margin:6px 0 0;padding-left:18px}
.fs{border-top:1px solid var(--line);padding-block:16px 6px}
.fs:first-of-type{border-top:0;padding-top:0}
.fs-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fs-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.fs-h .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);margin-left:auto;text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:13.5px}
.f textarea{resize:vertical;min-height:60px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type="checkbox"]{width:auto}
.hint{font-size:11.5px;color:var(--ink-3)}
.hint code{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);padding:1px 4px;border-radius:4px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.line-wrap{border-bottom:1px dashed var(--line);padding-bottom:8px;display:flex;flex-direction:column;gap:5px}
.line,.line-head{display:grid;grid-template-columns:minmax(0,1fr) 54px 66px 78px 28px;gap:6px;align-items:center}
.line input,.line select{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 7px;font-size:13px}
.line-head{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.line-sub{display:grid;grid-template-columns:minmax(0,1fr) 80px 28px;gap:6px;align-items:center}
.line-sub input{width:100%;border:1px solid transparent;background:var(--panel-2);border-radius:6px;padding:5px 7px;font-size:12px;color:var(--ink-2)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.att-row span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

.proj-picks{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.tot{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px;font-size:13px}

.mono{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.03em}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;
  box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-b{overflow:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px;flex:1}
.rd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}

.rd-img{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;position:sticky;top:0}

.rd-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.imgbtn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.dr-b{container-type:inline-size}
@container (max-width:640px){.rd{grid-template-columns:minmax(0,1fr)}.rd-img,.rd-side{position:static}.rd-img img{max-height:45vh}}
@media (max-width:700px){.rd-img,.rd-side{position:static}.rd-img img{max-height:45vh}}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.94);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-bar{display:flex;gap:8px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#fff}
.lb-bar b{margin-right:auto;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lb-bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.lb-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0}
.lb-body img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;cursor:zoom-in;display:block}
.lb-body.zoom{align-items:flex-start;justify-content:flex-start}
.lb-body.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.lb-body pre{background:#fff;color:#111;padding:16px;white-space:pre-wrap;max-width:820px;width:100%;font-size:13px;align-self:flex-start;border-radius:6px}
.d-sig.one{grid-template-columns:1fr 1fr}
.rd-img .ph{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.pick{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)}
.pick:hover{background:var(--panel-2)}
.pick img,.pick .ph{width:40px;height:40px;object-fit:cover;object-position:top;border-radius:4px;background:var(--panel-2)}
.pick b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.pick .a{font-family:var(--f-mono);font-weight:600}
.lib-item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.logo-prev{border:1px dashed var(--line);border-radius:var(--r);padding:14px;background:#fff;display:flex;align-items:center;justify-content:center;min-height:70px}

.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}

.catrow{display:grid;grid-template-columns:34px minmax(0,1fr) 70px 28px;gap:8px;align-items:center}
.catrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.catrow .inp{width:100%}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.busy{position:fixed;inset:0;z-index:56;background:var(--bg);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--panel);border-radius:12px;padding:18px 22px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.25)}

/* =================== THE DOCUMENT (paper) =================== */
.page{width:816px;height:1056px;background:var(--paper);color:var(--paper-ink);position:relative;overflow:hidden;padding:60px 64px 0;font-family:var(--f-body);font-size:12px;line-height:1.5}

.page-body{height:912px}

/* ---------- settings: tabs + search ---------- */

.st-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

.st-tab:hover{background:var(--panel-2)}
.st-tab[aria-selected="true"]{background:var(--ink);color:var(--panel)}

.st-pane{display:none;flex-direction:column;gap:6px}
.st-pane.on{display:flex}
.st-pane-h{display:none;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:10px}

@media (max-width:640px){.btn.gear .gear-l{display:none}}
.blk{display:flow-root;padding-bottom:16px}
.blk.tight{padding-bottom:8px}
.blk.loose{padding-bottom:24px}
.blk.flush{padding-bottom:0}
.measure{position:absolute;left:-99999px;top:0;width:688px;visibility:hidden;pointer-events:none}
.export-host{position:fixed;left:0;top:0;width:816px;height:1056px;z-index:54}

.d-top{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:4px}
.d-logo img{height:76px;max-width:260px;width:auto;object-fit:contain;display:block}
.d-word{display:flex;flex-direction:column;line-height:1}
.d-word b{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.d-word span{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;margin-top:4px;color:var(--paper-mute)}
.d-meta{text-align:right;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-mute);line-height:1.6}
.d-meta b{display:block;color:var(--paper-ink);font-size:10px;font-weight:600;letter-spacing:.14em}
.d-stamp{display:inline-block;margin-top:4px;color:#fff;font-weight:600;padding:2px 7px;letter-spacing:.14em}
.d-title{margin-top:30px}
.d-eyebrow{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-accent)}
.d-h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:6px 0 0;font-size:46px;text-wrap:balance}
.d-h1.long{font-size:36px}
.d-h1.xlong{font-size:29px}
.slate{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--paper-ink);border-left:1px solid var(--paper-line)}
.slate div{border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:8px 10px 9px;min-width:0}
.slate i{display:block;font-style:normal;font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-mute)}
.slate span{display:block;font-weight:600;font-size:12px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.slate .big{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:.01em}
.slate .acc{background:var(--doc-accent);color:#fff}
.slate .acc i{color:rgba(255,255,255,.75)}
.d-parties{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.d-parties i{display:block;font-style:normal;font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--doc-accent);margin-bottom:4px}
.d-parties b{display:block;font-weight:600;font-size:12.5px}
.d-parties span{display:block;color:var(--paper-mute);white-space:pre-line;font-size:11.5px;line-height:1.5}
.d-intro{font-size:11.5px;color:var(--paper-ink);max-width:640px;line-height:1.6;margin:0}
.d-sec{display:flex;align-items:center;gap:10px;border-bottom:1.5px solid var(--paper-ink);padding-bottom:6px}
.d-sec .n{width:22px;height:22px;background:var(--doc-accent);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.d-sec h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.d-sec em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-mute)}
.tr{display:grid;grid-template-columns:var(--cols);gap:12px;padding:7px 0 8px;border-bottom:1px solid var(--paper-line);align-items:baseline;font-variant-numeric:tabular-nums}
.tr.h{font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--paper-mute);border-bottom:1px solid var(--paper-ink);padding:10px 0 6px}
.tr .r{text-align:right}
.tr .q{color:var(--paper-mute);white-space:nowrap}
.tr .m{font-family:var(--f-mono);font-size:10px;color:var(--paper-mute);white-space:nowrap}

.tr .cdot{display:inline-block;width:7px;height:7px;margin-right:6px;vertical-align:1px}

.tr.grp b{font-family:var(--f-mono);font-weight:600}
.bk-h .cdot{display:inline-block;width:12px;height:12px;margin:0 6px 0 2px;vertical-align:1px}

.tr.st b{font-family:var(--f-mono);font-weight:600}
.tr .share{height:8px;background:var(--paper-soft);position:relative}

.d-totals{margin-left:auto;width:320px;font-variant-numeric:tabular-nums}
.d-totals div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--paper-line)}

.d-totals .t{border-bottom:0;border-top:2px solid var(--paper-ink);margin-top:2px;padding-top:7px}
.d-totals .t span{color:var(--paper-ink)!important;font-weight:600}

.d-totals .due span:last-child{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.d-pay{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.d-subh{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.d-pre{white-space:pre-line;font-size:11.5px;line-height:1.6}
.d-note{display:flex;gap:10px;align-items:flex-start;background:var(--paper-soft);padding:10px 12px;font-size:11.5px}
.d-note i{font-style:normal;font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--doc-accent);padding-top:3px;white-space:nowrap}
.d-note span{white-space:pre-line}
.d-legal{font-size:11px;line-height:1.6;color:#2A2E35;max-width:660px;white-space:pre-line;margin:0}
.d-sig-h{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-accent);margin-bottom:12px}
.d-sig{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.d-party>b{display:block;font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.d-party>i{display:block;font-style:normal;font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-mute)}
.d-sl{margin-top:14px}
.d-sl2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}
.d-sl .v{height:20px;font-size:12px;display:flex;align-items:flex-end;padding-bottom:3px;white-space:nowrap;overflow:hidden}

.d-sl small{display:block;font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-mute);margin-top:3px}
.bk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--paper-ink);padding-bottom:6px;margin-bottom:14px}

.bk-h span{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-mute)}

.bk-cell{display:flex;flex-direction:column;gap:8px}

.bk-cap b{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-cap span{font-family:var(--f-mono);font-size:9px;color:var(--paper-mute);white-space:nowrap;letter-spacing:.06em}

.bk-none{border:1px dashed var(--paper-line);padding:16px;color:var(--paper-mute);font-size:11px}

.rec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}

.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-top:10px}
.sec-h{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;margin:28px 0 4px}

.calc{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);background:var(--panel-2);border-radius:6px;padding:8px 10px}
/* ---------- app shell: sidebar ---------- */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);align-items:start}

const lineAmt = l => (l.qty === "" || l.qty == null ? 1 : num(l.qty)) * num(l.rate);
function invCalc(inv) {
  const services = inv.lines.reduce((a, l) => a + lineAmt(l), 0);
  const recs = (inv.receiptIds || []).map(receipt).filter(Boolean).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const expBase = recs.reduce((a, r) => a + num(r.amount), 0);
  const markup = expBase * num(inv.markupPct) / 100;
  const expenses = expBase + markup;
  const discount = inv.discountType === "pct" ? services * num(inv.discount) / 100 : Math.min(num(inv.discount), services);
  const taxable = services - discount + (inv.taxExpenses ? expenses : 0);
  const tax = taxable * num(inv.taxPct) / 100;
  const total = services - discount + expenses + tax;
  const paid = num(inv.paid);
  return {services, recs, expBase, markup, expenses, discount, tax, total, paid, due: total - paid};
}
function estCalc(e) {
  const services = e.lines.reduce((a, l) => a + lineAmt(l), 0);
  const discount = e.discountType === "pct" ? services * num(e.discount) / 100 : Math.min(num(e.discount), services);
  const tax = (services - discount) * num(e.taxPct) / 100;
  const total = services - discount + tax;
  return {services, discount, tax, total, deposit: total * num(e.depositPct) / 100};
}

let stripCache = {};
function stripImg(color) {
  if (stripCache[color]) return stripCache[color];
  const c = document.createElement("canvas"); c.width = 816 * 3; c.height = 12 * 3;
  const g = c.getContext("2d"); g.scale(3, 3);
  g.fillStyle = "#15171B"; g.fillRect(0, 0, 816, 12);
  g.fillStyle = "#FFFFFF";
  for (let x = -12; x < 830; x += 24) { g.beginPath(); g.moveTo(x, 12); g.lineTo(x + 12, 0); g.lineTo(x + 24, 0); g.lineTo(x + 12, 12); g.closePath(); g.fill(); }
  g.fillStyle = color; g.fillRect(0, 0, 96, 12);
  return (stripCache[color] = c.toDataURL("image/png"));
}

function paginate(blocks, type) {
  const m = $("#measure");
  m.className = "measure page-body" + (type === "sow" ? " sowp" : "");   // measure with the same styles the page uses
  m.innerHTML = blocks.map(b => `<div class="blk ${b.cls || ""}">${b.html}</div>`).join("");
  const hs = [...m.children].map(el => el.getBoundingClientRect().height);
  m.innerHTML = "";
  const CAP = 912, pages = [[]]; let used = 0;
  for (let i = 0; i < blocks.length; i++) {
    let need = hs[i];
    let j = i; while (blocks[j] && blocks[j].kwn && j + 1 < blocks.length) { j++; need += hs[j]; }
    if (used > 0 && used + need > CAP) { pages.push([]); used = 0; }
    pages[pages.length - 1].push(i); used += hs[i];
  }
  return pages;
}

/* Receipt backup pages: portrait receipts two to a page, wide ones alone. */
function backupBodies(recs, label) {
  const sorted = byCategory(recs.filter(r => imgId(r)));
  const withImg = sorted.flatMap(G => G.recs);
  if (!withImg.length) return [];
  const groups = []; let pair = [], lastCat = null;
  for (const r of withImg) {
    const wide = num(r.w) > num(r.h) * 1.05, ck = cat(r.categoryId).id;
    if (pair.length && ck !== lastCat) { groups.push(pair); pair = []; }   // a page never mixes categories
    lastCat = ck;
    if (wide) { if (pair.length) { groups.push(pair); pair = []; } groups.push([r]); }
    else { pair.push(r); if (pair.length === 2) { groups.push(pair); pair = []; } }
  }
  if (pair.length) groups.push(pair);
  let idx = 0;
  return groups.map(g => {
    const solo = g.length === 1 && num(g[0].w) > num(g[0].h) * 1.05;
    const boxW = solo ? 688 : 332, boxH = 820;
    const cells = g.map(r => {
      const w = num(r.w) || 1000, h = num(r.h) || 1400;
      const s = Math.min(boxW / w, boxH / h);
      const ct = cat(r.categoryId);
      return `<div class="bk-cell" style="width:${boxW}px"><div class="bk-cap"><b>${esc(r.vendor || "Receipt")}</b><span>${esc(fShort(r.date, true))} · ${esc(ct.name)} · ${money(r.amount)}</span></div>
        <img src="${blobUrl(imgId(r))}" alt="Receipt from ${esc(r.vendor || "vendor")}" width="${Math.round(w * s)}" height="${Math.round(h * s)}" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px"></div>`;
    }).join("");
    const from = idx + 1; idx += g.length;
    const gc = cat(g[0].categoryId);
    return `<div class="bk-h"><b>Receipt backup · <i class="cdot" style="background:${esc(gc.color)}"></i>${esc(gc.name)}</b><span>${esc(label)} · ${from === idx ? from : from + "–" + idx} of ${withImg.length}</span></div><div class="bk-grid">${cells}</div>`;
  });
}

function pagesHTML(type, doc) {
  CUR = doc.currency || "USD";
  const blocks = type === "invoice" ? invoiceBlocks(doc) : type === "estimate" ? estimateBlocks(doc) : type === "sow" ? sowBlocks(doc) : reportBlocks(doc);
  const pages = paginate(blocks, type);
  const bodies = pages.map(idx => idx.map(i => `<div class="blk ${blocks[i].cls || ""}">${blocks[i].html}</div>`).join(""));
  const withBackup = type === "invoice" ? doc.attachBackup : type === "report" ? doc.includeBackup : false;
  if (withBackup) {
    const recs = type === "invoice" ? invCalc(doc).recs : repCalc(doc).recs;
    bodies.push(...backupBodies(recs, doc.number));
  }
  const n = bodies.length, accent = settings.accent || SETTINGS_DEFAULT.accent;
  const kind = KIND[type];

/* Most recently active first: a project's latest start date, edit, or invoice/estimate/receipt/report/SOW date; a client's latest across its projects and documents. */
function recency() {
  const pr = new Map(), cr = new Map();
  const t = x => typeof x === "number" ? x : (Date.parse(x || "") || 0);
  const bump = (m, id, v) => { if (id && v > (m.get(id) || 0)) m.set(id, v); };
  for (const p of projects) { const v = Math.max(t(p.startDate), t(p.updatedAt), t(p.createdAt)); bump(pr, p.id, v); bump(cr, p.clientId, v); }
  for (const coll of [invoices, estimates, receipts, reports, clientSows, sows, crewInvoices]) for (const d of coll) {
    const v = Math.max(t(d.date), t(d.startDate), t(d.updatedAt), t(d.createdAt));
    bump(pr, d.projectId, v); (d.projectIds || []).forEach(pid => bump(pr, pid, v)); bump(cr, d.clientId, v);
  }
  for (const [pid, v] of pr) { const p = projects.find(x => x.id === pid); if (p) bump(cr, p.clientId, v); }
  return {pr, cr};
}

async function saveDoc(quiet) {

async function pdfToCanvas(file, wantText) {
  await ensurePdfjs();
  const doc = await window.pdfjsLib.getDocument({data: await file.arrayBuffer(), isEvalSupported: false}).promise;
  let text = "";
  if (wantText) for (let i = 1; i <= Math.min(doc.numPages, 60); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    text += tc.items.map(it => (it.str || "") + (it.hasEOL ? "\n" : " ")).join("") + "\n\n";
  }
  const n = Math.min(doc.numPages, wantText ? 4 : 3), canv = [];
  for (let i = 1; i <= n; i++) {
    const page = await doc.getPage(i);
    const v0 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: Math.min(3.5, 2000 / v0.width)});
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: g, viewport: vp}).promise;
    canv.push(c);
  }
  const stack = canv.slice(0, 3);
  const W = Math.max(...stack.map(c => c.width)), H = stack.reduce((a, c) => a + c.height, 0);
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const g = out.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  let y = 0; for (const c of stack) { g.drawImage(c, 0, y); y += c.height; }
  return {canvas: out, pages: doc.numPages, text, pageCanvases: canv};
}
function fileToCanvas(file) {

    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;

}

async function readReceipt(blob, rec) {

Categories to choose from (use one name exactly): ${names.join(" | ")}
Return ONLY a JSON object with these keys:
{"vendor": "business name as printed", "date": "YYYY-MM-DD transaction date or empty string", "total": number (final amount charged, including tax and tip) or null, "tax": number or null, "tip": number or null, "currency": "USD" or the 3-letter code shown, "paymentMethod": "card brand and last 4 digits like Visa 4821, or Cash, or empty string", "category": "one category name from the list", "description": "what was bought, under 8 words", "items": [{"desc": "line item", "amount": number}] (at most 8, empty array if none), "confidence": "high" or "medium" or "low", "issue": "empty string, or one short sentence on anything unclear, e.g. faded total, two totals, not a receipt", "rotation": 0 or 90 or 180 or 270 (degrees the image must be turned clockwise so its printed text reads upright)}

    const j = await sample.json(prompt, {images: [blob], modelTier: "default"});
    const c = cats().find(x => x.name.toLowerCase() === String(j.category || "").toLowerCase());
    const out = {
      vendor: String(j.vendor || "").slice(0, 120),
      date: /^\d{4}-\d{2}-\d{2}$/.test(j.date || "") ? j.date : "",
      amount: j.total == null || !isFinite(+j.total) ? "" : r2(+j.total),
      tax: j.tax == null || !isFinite(+j.tax) ? "" : r2(+j.tax),
      tip: j.tip == null || !isFinite(+j.tip) ? "" : r2(+j.tip),
      currency: String(j.currency || "USD").slice(0, 3).toUpperCase(),
      paymentMethod: String(j.paymentMethod || "").slice(0, 40),
      description: String(j.description || "").slice(0, 120),
      items: Array.isArray(j.items) ? j.items.slice(0, 8).map(x => ({desc: String(x.desc || "").slice(0, 80), amount: isFinite(+x.amount) ? r2(+x.amount) : ""})) : [],
      status: "needs_review", readLater: false,
      rotation: [90, 180, 270].includes(+j.rotation) ? +j.rotation : 0,
      readNote: [j.confidence && j.confidence !== "high" ? `Confidence: ${j.confidence}.` : "", j.issue || "", j.currency && String(j.currency).toUpperCase() !== "USD" ? `Amounts are in ${String(j.currency).toUpperCase()}; convert to USD before billing.` : ""].filter(Boolean).join(" ")
    };

  } catch (e) {
    if (e && e.code === "offline") return {status: "needs_review", readLater: true, readNote: "Added offline. Claude reads it automatically when you’re back online."};

/* Receipts added with no connection get read once the connection is back. */
let readLaterBusy = false;
async function readLaterSweep() {
  if (readLaterBusy || !db || !sample || !sampleImages || navigator.onLine === false) return;
  const todo = receipts.filter(r => r.readLater && imgId(r));
  if (!todo.length) return;
  readLaterBusy = true;
  let n = 0;
  for (const r of todo) {
    try {
      const blob = await (await fetch(blobUrl(imgId(r)))).blob();
      const got = await readReceipt(blob, {categoryId: r.categoryId});
      if (got.readLater) break;                     // still offline
      delete got.rotation; got.readLater = false;
      if (r.vendor) delete got.vendor; if (r.amount !== "" && r.amount != null) delete got.amount; if (r.date) delete got.date;   // keep anything typed in by hand
      await db.doc("receipts/" + r.id).update(got); n++;
    } catch (e) { console.warn("read later", e); }
  }
  readLaterBusy = false;
  if (n) toast(`Claude read ${n} receipt${n === 1 ? "" : "s"} added while offline. Check the details.`);
}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const maxW = 900, maxH = 240; let w = img.naturalWidth || 900, h = img.naturalHeight || 240;
        const k = Math.min(1, maxW / w, maxH / h); w = Math.round(w * k); h = Math.round(h * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
        let out = c.toDataURL("image/png"); if (out.length > 180000) out = c.toDataURL("image/webp", 0.92); res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const CAD_LABEL = Object.fromEntries(CADENCE);
function advance(dateStr, cadence, day) {
  const d = pd(dateStr); if (!d) return "";
  if (cadence === "weekly") d.setDate(d.getDate() + 7);
  else if (cadence === "biweekly") d.setDate(d.getDate() + 14);
  else {
    const m = cadence === "quarterly" ? 3 : cadence === "yearly" ? 12 : 1;
    const want = num(day) || d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + m);
    d.setDate(Math.min(want, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  }
  return iso(d);
}
function fillPeriod(text, dateStr, cadence) {
  const d = pd(dateStr); if (!d || !text) return text || "";
  const month = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const period = cadence === "weekly" || cadence === "biweekly" ? `Week of ${fShort(dateStr, true)}` : cadence === "quarterly" ? `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}` : cadence === "yearly" ? String(d.getFullYear()) : month;
  return String(text).replace(/\{month\}/g, month).replace(/\{period\}/g, period).replace(/\{year\}/g, String(d.getFullYear()));
}

function solve8(A, b) {
